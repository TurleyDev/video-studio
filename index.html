<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Studio — Anthropic IPO</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif;background:#0b1019;color:white}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}.layout{display:grid;grid-template-columns:minmax(250px,400px) minmax(230px,330px);gap:24px;align-items:center}.video{position:relative;width:min(100%,400px);aspect-ratio:9/16;background:#05070c;overflow:hidden;border-radius:12px;box-shadow:0 20px 80px #0009;isolation:isolate}.scene{position:absolute;inset:0;opacity:0;overflow:hidden;will-change:opacity}.scene img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.08);will-change:transform;filter:contrast(1.03)}.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0002 0%,transparent 55%,#0004 100%);pointer-events:none}.scene.active{opacity:1}.timeline{position:absolute;bottom:0;left:0;height:4px;background:#ff9d62;width:0%;z-index:10}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls button{border:1px solid #3d4658;background:#1b2638;color:#fff;padding:11px 16px;border-radius:9px;cursor:pointer;font-weight:650}.controls button:hover{background:#31435f}.side h1{font-size:24px;margin:0 0 10px}.side p{color:#aab5c5;line-height:1.55}.time{font-variant-numeric:tabular-nums;color:#ffad78;font-size:21px;margin:15px 0}.scene-title{font-size:14px;color:#d9e2ef;margin:10px 0}.hint{font-size:12px!important;color:#8995a5!important}@media(max-width:720px){.layout{grid-template-columns:minmax(0,400px);justify-content:center}.video{width:min(100%,360px)}body{padding:12px}}
</style>
</head>
<body>
<main class="layout">
  <div class="video" id="video" aria-label="25-second vertical animated video preview">
    <div class="scene"><img src="assets/scene1.png" alt="Anthropic IPO opening"></div>
    <div class="scene"><img src="assets/scene2.png" alt="Anthropic AI revenue growth"></div>
    <div class="scene"><img src="assets/scene3.png" alt="Anthropic valuation concerns"></div>
    <div class="scene"><img src="assets/scene4.png" alt="Anthropic investment debate"></div>
    <div class="timeline" id="timeline"></div>
  </div>
  <section class="side">
    <h1>Video Studio</h1>
    <p>Anthropic IPO · 25-second cinematic preview</p>
    <div class="time" id="clock">00:00 / 00:25</div>
    <div class="scene-title" id="label">Scene 1 — The $2 Trillion IPO</div>
    <div class="controls"><button id="play">Pause</button><button id="restart">Restart</button></div>
    <p class="hint">Four scenes with gentle Ken Burns motion and 0.8-second crossfades. This is a silent preview; narration and MP4 rendering will be added later.</p>
  </section>
</main>
<script>
// REUSABLE TEMPLATE SETTINGS — edit these for future projects.
const SETTINGS = {
  totalSeconds: 25,
  crossfadeSeconds: 0.8,
  scenes: [
    { start:0, end:6, title:'Scene 1 — The $2 Trillion IPO', from:[1.04,0,0], to:[1.15,-1.5,-1] },
    { start:6, end:12, title:'Scene 2 — Explosive AI Growth', from:[1.12,0,2], to:[1.04,0,-2] },
    { start:12, end:18, title:'Scene 3 — Wall Street Warning', from:[1.04,0,-2], to:[1.13,0,2] },
    { start:18, end:25, title:'Scene 4 — AI Revolution or Gamble?', from:[1.04,-1,0], to:[1.14,1,0] }
  ]
};
const scenes=[...document.querySelectorAll('.scene')];
const clock=document.querySelector('#clock'), label=document.querySelector('#label'), bar=document.querySelector('#timeline');
const playButton=document.querySelector('#play');
let current=0, playing=true, previous=null, raf=0;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const smooth=v=>{v=clamp(v);return v*v*(3-2*v)};
const lerp=(a,b,t)=>a+(b-a)*t;
const stamp=t=>`00:${String(Math.floor(t)).padStart(2,'0')}`;
function render(t){
  t=clamp(t,0,SETTINGS.totalSeconds);
  SETTINGS.scenes.forEach((s,i)=>{
    const fade=SETTINGS.crossfadeSeconds;
    // Each new scene overlaps the previous scene for 0.8 seconds.
    const begin=i===0?0:s.start-fade;
    const enter=i===0?1:smooth((t-begin)/fade);
    const exit=i===SETTINGS.scenes.length-1?1:1-smooth((t-(s.end-fade))/fade);
    const visible=t>=begin&&t<=s.end ? Math.min(enter,exit) : 0;
    scenes[i].style.opacity=String(visible);
    const p=smooth((t-begin)/(s.end-begin));
    const [z,x,y]=s.from.map((v,k)=>lerp(v,s.to[k],p));
    scenes[i].firstElementChild.style.transform=`translate(${x}%,${y}%) scale(${z})`;
  });
  bar.style.width=`${t/SETTINGS.totalSeconds*100}%`;
  clock.textContent=`${stamp(t)} / ${stamp(SETTINGS.totalSeconds)}`;
  const active=SETTINGS.scenes.findIndex(s=>t<s.end);
  label.textContent=SETTINGS.scenes[Math.max(0,active<0?SETTINGS.scenes.length-1:active)].title;
}
function tick(now){
  if(previous!==null&&playing)current+=(now-previous)/1000;
  previous=now;
  if(current>=SETTINGS.totalSeconds){current=SETTINGS.totalSeconds;playing=false;playButton.textContent='Play';}
  render(current);
  if(playing)raf=requestAnimationFrame(tick);
}
function start(){if(current>=SETTINGS.totalSeconds)current=0;playing=true;previous=null;playButton.textContent='Pause';cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
playButton.onclick=()=>{if(playing){playing=false;cancelAnimationFrame(raf);playButton.textContent='Play'}else start()};
document.querySelector('#restart').onclick=()=>{current=0;render(0);start()};
render(0);start();
</script>
</body>
</html>
